# Client config for box's wg-travel server; see wireguard.nix.
#
# Each client needs its own keypair and address, and a matching peer there.
# A client that routes its LAN to box (like the Opal) must not masquerade it.

# Used addresses:
# Opal: 10.100.0.2


[Interface]
PrivateKey = <CLIENT PRIVATE KEY>
Address = 10.100.0.XXX/32
MTU = 1280

[Peer]
PublicKey = Su05mC0Q/k6LH5FuI/wJRi/+7GgS/p2z8U71WqEHalM=
Endpoint = home.paholg.com:51820
# box's tunnel and LAN addresses; everything else stays off the tunnel.
AllowedIPs = 10.100.0.1/32, 10.0.0.4/32
PersistentKeepalive = 25
